  <!-- Wheels -->
  <circle cx="320" cy="275" r="22" fill="#18181c" stroke="#888" stroke-width="2"/>
  <circle cx="550" cy="275" r="22" fill="#18181c" stroke="#888" stroke-width="2"/>
  <text x="400" y="330" fill="#a0a0a8" font-family="'Barlow', sans-serif" font-size="16" letter-spacing="4" text-anchor="middle" text-transform="uppercase">Porsche Intelligent Performance</text>
