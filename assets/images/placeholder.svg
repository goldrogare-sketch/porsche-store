  </g>
  <!-- Stylized Porsche Sports Silhouette -->
  <path d="M 220 270 Q 280 268 320 240 Q 380 200 480 200 Q 550 200 600 245 Q 630 255 660 265 Q 665 272 650 275 L 590 275 Q 585 245 550 245 Q 515 245 510 275 L 360 275 Q 355 245 320 245 Q 285 245 280 275 Z" 
