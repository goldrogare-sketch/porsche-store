      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="50%" stop-color="#14151a" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D5001C" />
